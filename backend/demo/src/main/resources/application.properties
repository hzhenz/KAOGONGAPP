spring.application.name=kaogongapp-demo
server.port=8080

app.name=专注者App（考公版）
app.version=2.0
app.jwt-secret=demo-jwt-secret-for-kaogongapp-2026-keep-32-plus
app.jwt-expire-minutes=120
app.upload-dir=${UPLOAD_DIR:uploads}
app.zero-retention=${ZERO_RETENTION:true}
app.ai-enabled=${AI_ENABLED:false}
app.ai-api-url=${AI_API_URL:}
app.ai-api-key=${AI_API_KEY:}
app.ai-model=${AI_MODEL:}

spring.datasource.url=${DB_URL:jdbc:h2:mem:kaogongapp;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

